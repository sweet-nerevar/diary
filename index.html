<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eeeade">
<meta name="description" content="Интерактивный дневник Мэгги">
<title>WE WILL STAND TALL</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:'Palatino Linotype','Book Antiqua',Georgia,serif}

.launch{
  position:absolute;inset:0;display:grid;place-items:center;
  width:100%;height:100%;padding:3%;
  background:transparent;border:0;cursor:zoom-in;
  overflow:hidden;-webkit-tap-highlight-color:transparent;
}
.book-image{
  display:none;width:auto;height:auto;
  max-width:min(92vw,740px);max-height:90vh;
  object-fit:contain;user-select:none;-webkit-user-drag:none;
  transform:translateY(0) rotate(0) scale(1);
  transform-origin:50% 55%;
  filter:drop-shadow(6px 10px 9px rgba(30,34,21,.2));
  transition:transform .38s cubic-bezier(.2,.75,.2,1),filter .38s ease;
  pointer-events:none;
}
.launch.has-image .book-image{display:block}
.launch.has-image .book{display:none}
.launch:hover .book-image,.launch:focus-visible .book-image{
  transform:translateY(-5px) rotate(-1.7deg) scale(1.045);
  filter:drop-shadow(10px 15px 11px rgba(30,34,21,.28));
}
.launch:active .book-image{transform:translateY(-1px) scale(.98)}
.launch:focus-visible{outline:2px solid #637452;outline-offset:-3px}

/* Запасная CSS-обложка, только если картинка не загрузилась. */
.book{
  position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;
  width:min(60%,230px);max-height:95%;aspect-ratio:2.75/4;
  background:#4c5944;color:#eee1be;
  border-left:12px solid #303b2c;border-right:4px solid #34432e;
  border-radius:4px 9px 9px 4px;
  box-shadow:inset 0 0 0 3px #9e8a61,inset 0 0 0 11px #4c5944,
             inset 0 0 0 12px #9e8a61,5px 5px 0 #d6ccba,10px 8px 16px #0007;
  transform:rotate(-6deg);
  transition:transform .3s ease,filter .3s ease;
}
.book::before,.book::after{content:'✣';position:absolute;font-size:clamp(12px,3vmin,18px);color:#c6b58b}
.book::before{top:12%}.book::after{bottom:12%}
.book-mark{font:700 clamp(8px,1.7vmin,12px) 'Courier New',monospace;letter-spacing:.19em;margin:0 0 9%}
.book-title{font:italic clamp(17px,4.3vmin,36px)/1 'Palatino Linotype','Book Antiqua',Georgia,serif;letter-spacing:-.045em;text-align:center}
.book-sub{font:700 clamp(7px,1.2vmin,10px) 'Courier New',monospace;letter-spacing:.08em;text-align:center;margin-top:12%;line-height:1.5}
.launch:not(.has-image):hover .book,.launch:not(.has-image):focus-visible .book{
  transform:rotate(-3deg) scale(1.06);filter:brightness(1.08)
}


#diary-frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#eeeade}
.exit{position:fixed;z-index:6;top:5px;right:5px;display:none;padding:7px 12px;background:#e7e1d3;border:1px solid #a99f8e;color:#2c2b27;font:700 11px 'Courier New',monospace;cursor:pointer}
html:fullscreen,html:-webkit-full-screen{background:#eeeade}
html:fullscreen .launch,html:-webkit-full-screen .launch{display:none}
html:fullscreen #diary-frame,html:-webkit-full-screen #diary-frame{display:block}
html:fullscreen .exit,html:-webkit-full-screen .exit{display:block}
@keyframes open-book{from{transform:translateY(16px) scale(.94);opacity:0}to{transform:none;opacity:1}}
html:fullscreen #diary-frame,html:-webkit-full-screen #diary-frame{animation:open-book .42s ease-out both}

.fallback{display:none;position:fixed;inset:0;z-index:8;background:#eeeade;color:#2c2b27;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:20px;font:16px/1.4 Georgia,serif}
.fallback.show{display:flex}
.fallback a{padding:12px 16px;border:1px solid #a99f8e;color:inherit;text-decoration:underline}
.fallback button{padding:10px;border:0;background:none;text-decoration:underline;cursor:pointer}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<button class="launch" type="button" id="launch" aria-label="Открыть дневник Мэгги" title="Открыть дневник Мэгги">
  <img class="book-image" id="book-image" src="./assets/book_face.webp" alt="" draggable="false" width="1628" height="1160">
</button>

<iframe id="diary-frame" src="./diary.html" title="Дневник Мэгги" allow="fullscreen" loading="eager"></iframe>
<button class="exit" id="exit" type="button" aria-label="Закрыть дневник">× ЗАКРЫТЬ</button>
<div class="fallback" id="fallback" role="status" aria-live="polite">
  <p>В этом встраивании не удалось развернуть дневник на весь экран.</p>
  <a href="./diary.html" target="_blank" rel="noopener">Открыть дневник в новой вкладке ↗</a>
  <button type="button" id="dismiss">Вернуться к книжечке</button>
</div>
<script>
(()=>{
'use strict';
const launch=document.getElementById('launch'),fallback=document.getElementById('fallback');
const frame=document.getElementById('diary-frame'),image=document.getElementById('book-image');
image.addEventListener('load',()=>launch.classList.add('has-image'));
image.addEventListener('error',()=>launch.classList.remove('has-image'));
if(image.complete&&image.naturalWidth>0)launch.classList.add('has-image');
launch.addEventListener('click',async()=>{
 fallback.classList.remove('show');
 try{
   if(!document.documentElement.requestFullscreen)throw new Error('Fullscreen unavailable');
   await document.documentElement.requestFullscreen();
 }catch(e){fallback.classList.add('show');}
});
document.getElementById('exit').addEventListener('click',()=>{
 if(document.fullscreenElement)document.exitFullscreen();
});
document.getElementById('dismiss').addEventListener('click',()=>fallback.classList.remove('show'));
window.addEventListener('message',e=>{
 if(e.source!==frame.contentWindow||!e.data||e.data.type!=='MAGGIE_DIARY_CLOSE')return;
 if(document.fullscreenElement)document.exitFullscreen();
});
let wasFull=false;
document.addEventListener('fullscreenchange',()=>{
 const full=Boolean(document.fullscreenElement);
 if(wasFull&&!full){frame.src='./diary.html';launch.focus({preventScroll:true});}
 wasFull=full;
});
})();
</script>
</body>
</html>
